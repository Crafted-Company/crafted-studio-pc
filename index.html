<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crafted Studio Code</title>
    <link rel="icon" type="image/png" href="/cscode.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      @keyframes spinCrafted {
        0% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(180deg) scale(1.08); }
        100% { transform: rotate(360deg) scale(1); }
      }
      @keyframes pulseCraftedGlow {
        0% { opacity: 0.7; filter: drop-shadow(0 0 16px rgba(169, 69, 45, 0.35)); }
        100% { opacity: 1; filter: drop-shadow(0 0 28px rgba(67, 63, 169, 0.65)); }
      }
    </style>
  </head>
  <body class="bg-[#1B1515] text-[#F3EFEF] overflow-hidden select-none antialiased">
    <div id="root">
      <!-- Immediate Zero-Delay Official Crafted Co Startup Splash Screen -->
      <div style="position: fixed; inset: 0; background: #1B1515; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: Inter, system-ui, sans-serif; color: #F3EFEF; z-index: 9999;">
        <div style="position: relative; width: 68px; height: 68px; margin-bottom: 24px; animation: spinCrafted 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite, pulseCraftedGlow 2s ease-in-out infinite alternate;">
          <svg viewBox="0 0 100 100" fill="none" style="width: 100%; height: 100%;">
            <defs>
              <linearGradient id="craftedGradSplash" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#433FA9" />
                <stop offset="50%" stop-color="#A9452D" />
                <stop offset="100%" stop-color="#4641A9" />
              </linearGradient>
            </defs>
            <rect x="20" y="20" width="60" height="60" rx="18" transform="rotate(45 50 50)" stroke="url(#craftedGradSplash)" stroke-width="6" fill="none" />
            <path d="M50 30 L70 50 L50 70 L30 50 Z" fill="url(#craftedGradSplash)" opacity="0.9" />
          </svg>
        </div>
        <div style="font-size: 18px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px; color: #F3EFEF;">Crafted Studio Code</div>
        <div style="font-size: 12px; color: #A19898; font-family: monospace;">Loading workspace...</div>
      </div>
    </div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
